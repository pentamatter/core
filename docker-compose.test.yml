services:
  mongo-test:
    image: mongo:7
    ports:
      - "27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    tmpfs:
      - /data/db

  redis-test:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    tmpfs:
      - /data

  meilisearch-test:
    image: getmeili/meilisearch:v1.12
    ports:
      - "7701:7700"
    environment:
      - MEILI_MASTER_KEY=test-master-key
      - MEILI_ENV=development
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    tmpfs:
      - /meili_data
